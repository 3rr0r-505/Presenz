name: Build, Release and Security Scan

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: "latest"
        type: choice
        options:
          - latest
          - versioned

permissions:
  contents: write

env:
  APP_NAME: presenz

# ======================================
# 1️⃣ SECURITY SCAN (Every Commit)
# ======================================
jobs:
  security-scan:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: 1

# ======================================
# 2️⃣ BUILD EXECUTABLES
# ======================================
  build-binaries:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executable
        run: pyinstaller --onefile main.py --name ${{ env.APP_NAME }}

      - name: Rename Binary (Linux/macOS)
        if: runner.os != 'Windows'
        run: mv dist/${{ env.APP_NAME }} dist/${{ env.APP_NAME }}-${{ runner.os }}

      - name: Rename Binary (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: ren dist\${{ env.APP_NAME }}.exe ${{ env.APP_NAME }}-windows.exe

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ runner.os }}
          path: dist/*

# ======================================
# 3️⃣ BUILD DOCKER IMAGE
# ======================================
  docker-build:
    runs-on: ubuntu-latest
    needs: build-binaries

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t ${{ env.APP_NAME }}:latest .
          docker save ${{ env.APP_NAME }}:latest -o ${{ env.APP_NAME }}-docker.tar

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: ${{ env.APP_NAME }}-docker.tar

# ======================================
# 4️⃣ UPDATE LATEST VERSIONED RELEASE (Every Commit)
# ======================================
  update-latest:
    if: >
      (github.ref_type != 'tag' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_type == 'latest')
    runs-on: ubuntu-latest
    needs: [build-binaries, docker-build]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Latest Tag
        id: get_tag
        run: echo "tag=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Create Source Archives
        run: |
          git archive --format=zip -o ${{ env.APP_NAME }}-source.zip HEAD
          git archive --format=tar.gz -o ${{ env.APP_NAME }}-source.tar.gz HEAD

      - name: Update Latest Versioned Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          make_latest: false
          files: |
            release-artifacts/**/*
            ${{ env.APP_NAME }}-source.zip
            ${{ env.APP_NAME }}-source.tar.gz

# ======================================
# 5️⃣ CREATE VERSIONED RELEASE (On Tag)
# ======================================
  publish-release:
    if: >
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_type == 'versioned')
    runs-on: ubuntu-latest
    needs: [build-binaries, docker-build]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Create Source Archives
        run: |
          git archive --format=zip -o ${{ env.APP_NAME }}-source.zip HEAD
          git archive --format=tar.gz -o ${{ env.APP_NAME }}-source.tar.gz HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          files: |
            release-artifacts/**/*
            ${{ env.APP_NAME }}-source.zip
            ${{ env.APP_NAME }}-source.tar.gz