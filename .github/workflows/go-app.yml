name: Build, Release and Security Scan

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: "latest"
        type: choice
        options:
          - latest
          - versioned

permissions:
  contents: write

env:
  APP_NAME: presenz
  GO_VERSION: "1.26.5"

# ======================================
# 1️⃣ SECURITY SCAN (Every Commit)
# ======================================
jobs:
  security-scan:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

# ======================================
# 2️⃣ BUILD EXECUTABLES
# ======================================
  build-binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64.exe
          - goos: darwin
            goarch: amd64
            suffix: macos-amd64
          - goos: darwin
            goarch: arm64
            suffix: macos-arm64

    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build Executable
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -ldflags="-s -w" -o dist/${{ env.APP_NAME }}-${{ matrix.suffix }} ./cmd/presenz

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.suffix }}
          path: dist/*

# ======================================
# 3️⃣ BUILD DOCKER IMAGE
# ======================================
  docker-build:
    runs-on: ubuntu-latest
    needs: build-binaries

    steps:
      - uses: actions/checkout@v7

      - name: Build Docker Image
        run: |
          docker build -t ${{ env.APP_NAME }}:latest .
          docker save ${{ env.APP_NAME }}:latest -o ${{ env.APP_NAME }}-docker.tar

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: ${{ env.APP_NAME }}-docker.tar

# ======================================
# 4️⃣ UPDATE LATEST VERSIONED RELEASE (Every Commit)
# ======================================
  update-latest:
    if: >
      (github.ref_type != 'tag' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_type == 'latest')
    runs-on: ubuntu-latest
    needs: [build-binaries, docker-build]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get Latest Tag
        id: get_tag
        run: echo "tag=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Create Source Archives
        run: |
          git archive --format=zip -o ${{ env.APP_NAME }}-source.zip HEAD
          git archive --format=tar.gz -o ${{ env.APP_NAME }}-source.tar.gz HEAD

      - name: Update Latest Versioned Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          make_latest: false
          files: |
            release-artifacts/**/*
            ${{ env.APP_NAME }}-source.zip
            ${{ env.APP_NAME }}-source.tar.gz

# ======================================
# 5️⃣ CREATE VERSIONED RELEASE (On Tag)
# ======================================
  publish-release:
    if: >
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_type == 'versioned')
    runs-on: ubuntu-latest
    needs: [build-binaries, docker-build]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Create Source Archives
        run: |
          git archive --format=zip -o ${{ env.APP_NAME }}-source.zip HEAD
          git archive --format=tar.gz -o ${{ env.APP_NAME }}-source.tar.gz HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          make_latest: true
          files: |
            release-artifacts/**/*
            ${{ env.APP_NAME }}-source.zip
            ${{ env.APP_NAME }}-source.tar.gz